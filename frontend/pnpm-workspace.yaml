allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  maplibre-gl: false
  unrs-resolver: false
  vue-demi: false

# Allowlist for pnpm's minimumReleaseAge supply-chain gate (rejects packages
# younger than the cutoff). These first-party Vue org releases were still within
# the window when the pinia v4 major landed; without the exclude, CI's
# `pnpm install --frozen-lockfile` fails the policy check. Prune entries once the
# versions have aged well past the cutoff.
minimumReleaseAgeExclude:
  - '@pinia/nuxt@1.0.0'
  - 'pinia@4.0.2'

# Force patched versions of transitive (build/dev-time) deps flagged by Dependabot.
overrides:
  # Dedupe Vue to a single copy. The nuxt 4.5 bump pulls vue 3.5.40 for the app
  # runtime while @nuxt/test-utils' peer still resolved vue 3.5.35 — two Vue
  # instances break mountSuspended (component instance is null, "reading 'ce'"
  # in the Vitest component tests). Pin one version so runtime and test-utils
  # share it. Bump this in lockstep with the nuxt/vue version going forward.
  vue: 3.5.40
  shell-quote: '>=1.8.4'
  vite: '>=7.3.5'
  esbuild: '>=0.28.1'
  # tar/js-yaml ranges bumped: the prior floors (7.5.16 / 4.1.2) still resolved
  # to versions Dependabot flagged (tar 7.5.20 GHSA / js-yaml 5.2.1 GHSA).
  tar: '>=7.5.21'
  js-yaml: '>=5.2.2'
  launch-editor: '>=2.14.1'
  '@babel/core': '>=7.29.1'
  # Override di atas tidak berbatas atas, sehingga pnpm menariknya ke @babel/core 8.
  # Seluruh plugin Babel di pohon ini masih 7.x (tidak ada satu pun paket yang menuntut
  # ^8), dan workbox-build 7.4.1 — yang dipakai vite-plugin-pwa untuk menulis service
  # worker — menuntut @babel/core ^7.24.4. Dipasangkan dengan core 8, @rollup/plugin-babel
  # gagal: "Requires Babel ^7.0.0-0, but was loaded with 8.0.1", dan build berhenti dengan
  # "Unable to write the service worker file". Batas atas ini BERLINGKUP hanya ke subpohon
  # workbox-build, jadi paket lain tidak berubah, dan lantai keamanan >=7.29.1 tetap utuh.
  'workbox-build>@babel/core': '>=7.29.1 <8'
  # brace-expansion CVE-2026-14257 (DoS OOM): whole <=5.0.7 range affected, only
  # 5.0.8 patched — forces both the 2.1.x and 5.0.x copies in the tree to 5.0.8.
  brace-expansion: '>=5.0.8'
  valibot: '>=1.4.2'
