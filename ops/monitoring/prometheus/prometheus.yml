global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [http_2xx]
    # Targetnya TIDAK dikeraskan di sini. Prometheus tidak meng-expand variabel
    # lingkungan di dalam konfigurasinya, jadi domainnya dirender ke berkas ini oleh
    # layanan sekali-jalan `prometheus-targets` di docker-compose.monitoring.yml, dari
    # DOMAIN di .env.prod — sumber yang sama yang dipakai Caddy dan compose produksi.
    # Ganti domain cukup di .env.prod; jangan menambahkan static_configs di sini lagi.
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
